services:
  app:
    build: .
    container_name: node-demo-compose
    ports:
      - "3001:3000"
    restart: unless-stopped
    environment:
      HEALTH_FAIL: "false"
    mem_limit: 128m
    cpus: "0.50"
    networks:
      - monitoring

networks:
  monitoring:
    external: true
    name: devops-monitoring