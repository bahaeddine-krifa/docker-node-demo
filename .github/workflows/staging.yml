
name: Staging CI/CD

on:
  push:
    branches:
      - staging
  pull_request:
    branches:
      - staging

permissions:
  contents: read

jobs:
  test:
    name: Test Node.js application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  publish-image:
    name: Build, scan and publish staging image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          set -euo pipefail
          IMAGE="$DOCKER_USERNAME/docker-node-demo"
          docker build -t "$IMAGE:$GITHUB_SHA" .

      - name: Generate SBOM
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          set -euo pipefail
          IMAGE="$DOCKER_USERNAME/docker-node-demo:$GITHUB_SHA"

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            aquasec/trivy:0.70.0 \
            image \
            --format cyclonedx \
            --output /work/sbom.cdx.json \
            "$IMAGE"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-sbom
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 30    
          
      - name: Scan image with Trivy
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          set -euo pipefail
          IMAGE="$DOCKER_USERNAME/docker-node-demo"

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            aquasec/trivy:0.70.0 \
            image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            "$IMAGE:$GITHUB_SHA"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          set -euo pipefail
          docker push "$DOCKER_USERNAME/docker-node-demo:$GITHUB_SHA"

  deploy-staging:
    name: Deploy to staging EC2
    needs: publish-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: [self-hosted, staging]

    steps:
      - name: Deploy with Docker Compose
        env:
          IMAGE_TAG: ${{ github.sha }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$HOME/node-app-staging"

          docker login \
            --username "$DOCKER_USERNAME" \
            --password-stdin <<< "$DOCKER_PASSWORD"

          docker compose -f compose.staging.yaml pull
          docker compose -f compose.staging.yaml up -d --remove-orphans

          HEALTHY=0
          for i in {1..15}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              HEALTHY=1
              break
            fi
            sleep 2
          done

          if [ "$HEALTHY" -ne 1 ]; then
            docker compose -f compose.staging.yaml logs || true
            docker logout
            echo "Staging health check failed."
            exit 1
          fi

          docker logout
          echo "Staging deployment successful: $IMAGE_TAG"
