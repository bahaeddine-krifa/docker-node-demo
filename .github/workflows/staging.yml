
name: Staging CI/CD

on:
  push:
    branches:
      - staging
  pull_request:
    branches:
      - staging

permissions:
  contents: read

jobs:
  test:
    name: Test Node.js application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  publish-image:
    name: Build and publish staging image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          set -e
          IMAGE="$DOCKER_USERNAME/docker-node-demo"

          docker build -t "$IMAGE:$GITHUB_SHA" .
          docker push "$IMAGE:$GITHUB_SHA"

  deploy-staging:
    name: Deploy to staging EC2
    needs: publish-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: [self-hosted, staging]

    steps:
      - name: Deploy with Docker Compose
        env:
          IMAGE_TAG: ${{ github.sha }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$HOME/node-app-staging"

          docker login \
            --username "$DOCKER_USERNAME" \
            --password-stdin <<< "$DOCKER_PASSWORD"

          docker compose -f compose.staging.yaml pull
          docker compose -f compose.staging.yaml up -d --remove-orphans

          HEALTHY=0
          for i in {1..15}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              HEALTHY=1
              break
            fi
            sleep 2
          done

          if [ "$HEALTHY" -ne 1 ]; then
            docker compose -f compose.staging.yaml logs || true
            docker logout
            echo "Staging health check failed."
            exit 1
          fi

          docker logout
          echo "Staging deployment successful: $IMAGE_TAG"
