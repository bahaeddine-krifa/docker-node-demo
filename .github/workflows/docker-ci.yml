name: Docker CI

on:
  push:
    branches:
        - master

  pull_request:
    branches:
        - master

jobs:
  test-and-build:

    runs-on: ubuntu-latest

    steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '22'
            cache: 'npm'
        
        - name: Install dependencies
          run: npm ci

        - name: Run tests
          run: npm test

        - name: Build Docker image
          run: |
            docker build \
              -t ${{ secrets.DOCKER_USERNAME }}/docker-node-demo:${{ github.sha }} \
              -t ${{ secrets.DOCKER_USERNAME }}/docker-node-demo:latest \
              .

        - name: Login to Docker Hub
          uses: docker/login-action@v4
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

        - name: Push Docker image
          run: |
            docker push ${{ secrets.DOCKER_USERNAME }}/docker-node-demo:${{ github.sha }}
            docker push ${{ secrets.DOCKER_USERNAME }}/docker-node-demo:latest
  
  deploy:
    name: Deploy to AWS EC2
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/docker-node-demo:${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE
          script: |
            set -e

            echo "Deploying image: $IMAGE"

            sudo docker pull "$IMAGE"

            sudo docker stop node-server || true
            sudo docker rm node-server || true

            sudo docker run -d \
              --name node-server \
              --restart unless-stopped \
              -p 3000:3000 \
              "$IMAGE"

            echo "Deployment completed."
            sudo docker ps