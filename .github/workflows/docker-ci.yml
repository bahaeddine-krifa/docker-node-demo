name: Docker CI

on:
  push:
    branches:
        - main

  pull_request:
    branches:
        - main

jobs:
  test-and-build:

    runs-on: ubuntu-latest

    steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '22'
            cache: 'npm'
        
        - name: Install dependencies
          run: npm ci

        - name: Run tests
          run: npm test

        - name: Build Docker image
          run: docker build -t docker-node-demo .
        
        - name: Run Docker container
          run: docker run -d -p 3000:3000 --name node-server docker-node-demo
        
        - name: Test Docker container
          run: curl http://localhost:3000