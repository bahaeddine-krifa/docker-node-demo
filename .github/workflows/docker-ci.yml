name: Docker CI

on:
  push:
    branches:
        - master

  pull_request:
    branches:
        - master

jobs:
  test-and-build:

    runs-on: ubuntu-latest

    steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '22'
            cache: 'npm'
        
        - name: Install dependencies
          run: npm ci

        - name: Run tests
          run: npm test

        - name: Build Docker image
          run: |
            docker build \
              -t ${{ secrets.DOCKER_USERNAME }}/docker-node-demo:${{ github.sha }} \
              -t ${{ secrets.DOCKER_USERNAME }}/docker-node-demo:latest \
              .

        - name: Login to Docker Hub
          uses: docker/login-action@v4
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

        - name: Push Docker image
          run: |
            docker push ${{ secrets.DOCKER_USERNAME }}/docker-node-demo:${{ github.sha }}
            docker push ${{ secrets.DOCKER_USERNAME }}/docker-node-demo:latest
  
  deploy:
    name: Deploy to AWS EC2
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: self-hosted

    steps:
      - name: Deploy with Docker Compose and rollback
        env:
          IMAGE_TAG: ${{ github.sha }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$HOME/node-app"

          PROD_FILE=compose.production.yaml
          CANDIDATE_FILE=compose.candidate.yaml
          PROD_PROJECT=node-app-production
          CANDIDATE_PROJECT=node-app-candidate
          BACKUP=node-server-previous
          IMAGE="$DOCKER_USERNAME/docker-node-demo:$IMAGE_TAG"
          BACKUP_READY=0

          docker login --username "$DOCKER_USERNAME" \
            --password-stdin <<< "$DOCKER_PASSWORD"

          rollback() {
            echo "Rolling back to the previous container..."

            docker rm -f node-server >/dev/null 2>&1 || true

            if [ "$BACKUP_READY" = "1" ] &&
               docker inspect "$BACKUP" >/dev/null 2>&1; then
              docker rename "$BACKUP" node-server
              docker start node-server

              for i in {1..10}; do
                if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
                  echo "Rollback successful."
                  return 0
                fi
                sleep 2
              done

              echo "WARNING: rollback container did not pass health check."
              return 1
            fi

            echo "No backup container available."
            return 1
          }

          # Pull the exact commit image.
          docker pull "$IMAGE"

          # Test it on port 3001 before touching production.
          docker rm -f node-server-candidate >/dev/null 2>&1 || true

          docker compose -p "$CANDIDATE_PROJECT" \
            -f "$CANDIDATE_FILE" up -d --pull never

          HEALTHY=0
          for i in {1..10}; do
            if curl -fsS http://127.0.0.1:3001/ >/dev/null; then
              HEALTHY=1
              break
            fi
            sleep 2
          done

          if [ "$HEALTHY" -ne 1 ]; then
            docker compose -p "$CANDIDATE_PROJECT" \
              -f "$CANDIDATE_FILE" logs || true
            docker compose -p "$CANDIDATE_PROJECT" \
              -f "$CANDIDATE_FILE" down || true
            docker logout
            echo "Candidate failed; production was not changed."
            exit 1
          fi

          docker compose -p "$CANDIDATE_PROJECT" \
            -f "$CANDIDATE_FILE" down

          # Preserve the existing production container.
          docker rm -f "$BACKUP" >/dev/null 2>&1 || true

          if docker inspect node-server >/dev/null 2>&1; then
            if ! docker rename node-server "$BACKUP"; then
              docker logout
              exit 1
            fi

            BACKUP_READY=1

            if ! docker stop "$BACKUP"; then
              rollback || true
              docker logout
              exit 1
            fi
          fi

          # Start the new production version.
          if ! docker compose -p "$PROD_PROJECT" \
            -f "$PROD_FILE" up -d --pull never; then
            rollback || true
            docker logout
            exit 1
          fi

          # Check production before discarding the backup.
          HEALTHY=0
          for i in {1..10}; do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              HEALTHY=1
              break
            fi
            sleep 2
          done

          if [ "$HEALTHY" -ne 1 ]; then
            docker compose -p "$PROD_PROJECT" \
              -f "$PROD_FILE" logs || true
            rollback || true
            docker logout
            exit 1
          fi

          # Keep the backup until the new version is confirmed healthy.
          if [ "$BACKUP_READY" = "1" ]; then
            docker rm -f "$BACKUP"
          fi

          docker logout
          echo "Deployment successful: $IMAGE"
          docker ps